[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-ready"
version = "0.1.0"
description = "Private-first project care and release-candidate preparation: inspect, prepare and verify a private Git repository for public release without shipping secrets or its development history."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Socraticblock" }]
keywords = ["open source", "release engineering", "git history", "secrets", "privacy", "ai agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://socraticblock.com/work/open-ready/"
Repository = "https://github.com/socraticblock/open-source-ready"
Issues = "https://github.com/socraticblock/open-source-ready/issues"

[project.scripts]
openready = "openready.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
# Runtime remains standard-library-only. For pinned tooling use requirements-dev.lock.
dev = []

[tool.setuptools.package-data]
openready = ["contracts/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Repository-wide correctness checks; style migration is kept separate.
select = ["F", "E9"]

[tool.mypy]
python_version = "3.12"
strict = true
follow_imports = "silent"
files = ["src/openready/boundaries.py", "src/openready/backup.py", "src/openready/candidate.py", "src/openready/verify.py"]

[tool.coverage.run]
branch = true
source = ["openready"]

[tool.coverage.report]
show_missing = true
precision = 1
