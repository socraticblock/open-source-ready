name: checks

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  suite:
    name: quality (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-locked engineering tools
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint, types, security, branch coverage, mutation and acceptance gates
        run: python tools/check.py
      - name: Environment-scrubbed unit suite
        run: |
          env -i PATH="$PATH" HOME="$(mktemp -d)" LANG=C.UTF-8 TMPDIR="$(mktemp -d)" \
            PYTHONPATH=src "$(command -v python)" -m unittest discover -s tests -q
      - name: Installed wheel and sdist verification
        run: python tools/distribution_check.py
      - name: Coverage evidence
        if: always()
        run: python -m coverage xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-python-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: error
