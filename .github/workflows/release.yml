name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/checks.yml

  build-and-check:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install hash-locked build tools
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Match a release tag to the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as handle:
              version = tomllib.load(handle)['project']['version']
          if os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Release tag and package version disagree')
          PY
      - name: Verify installed distributions
        run: python tools/distribution_check.py
      - name: Build release distributions with pinned backend
        run: python -m build --no-isolation
      - name: Record artifact hashes and source revision
        run: |
          git rev-parse HEAD > dist/SOURCE-REVISION.txt
          sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-check
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Check artifact hashes
        run: |
          sha256sum --check dist/SHA256SUMS.txt
          mkdir packages
          cp dist/*.whl dist/*.tar.gz packages/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: packages/
          attestations: true
